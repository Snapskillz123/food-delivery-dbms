services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-food_delivery}
      POSTGRES_USER: ${POSTGRES_USER:-food_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-food_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-food_admin} -d ${POSTGRES_DB:-food_delivery}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: food-delivery-dbms:local
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-food_admin}:${POSTGRES_PASSWORD:-food_password}@db:5432/${POSTGRES_DB:-food_delivery}
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-food_admin}:${POSTGRES_PASSWORD:-food_password}@db:5432/${POSTGRES_DB:-food_delivery}
    command: ["sh", "-c", "alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  dashboard:
    image: food-delivery-dbms:local
    environment:
      SYNC_DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-food_admin}:${POSTGRES_PASSWORD:-food_password}@db:5432/${POSTGRES_DB:-food_delivery}
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
