# yaml-language-server: $schema=https://json.schemastore.org/render.json
databases:
  - name: food-delivery-db
    plan: free
    region: singapore
    postgresMajorVersion: "17"
    ipAllowList: []

services:
  - type: web
    name: food-delivery-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: alembic upgrade head && python scripts/seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
      - key: TAX_RATE
        value: "0.05"
      - key: DEFAULT_DELIVERY_FEE
        value: "40.00"

  - type: web
    name: food-delivery-dashboard
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    dockerCommand: streamlit run dashboard/app.py --server.address=0.0.0.0 --server.port=$PORT --server.headless=true
    healthCheckPath: /_stcore/health
    autoDeployTrigger: commit
    envVars:
      - key: SYNC_DATABASE_URL
        fromDatabase:
          name: food-delivery-db
          property: connectionString
